<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Celestial Survivor</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background-color: #000; color: white; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hidden { display: none; }

        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; }
        .bar-container { background-color: rgba(0,0,0,0.5); border: 1px solid #fff; border-radius: 4px; padding: 2px; }
        #health-bar { height: 16px; background-color: #f44336; border-radius: 2px; transition: width 0.2s; }
        #xp-bar { height: 8px; background-color: #2196f3; border-radius: 2px; transition: width 0.2s; }
        #level-display { position: absolute; top: 10px; right: 10px; font-size: 24px; font-weight: bold; }
        #timer-display { position: absolute; top: 40px; right: 10px; font-size: 20px; }

        #level-up-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        #skill-options { display: flex; gap: 20px; }
        .skill-card { background-color: #1a237e; border: 2px solid #3f51b5; padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; }
        .skill-card:hover { background-color: #303f9f; }

        #main-menu, #character-selection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            pointer-events: auto;
        }
        #character-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .character-card {
            background-color: #1a237e;
            border: 2px solid #3f51b5;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 150px;
        }
        .character-card.selected {
            border-color: #ffeb3b; /* yellow */
            box-shadow: 0 0 15px #ffeb3b;
        }
        .character-card:hover {
            background-color: #303f9f;
        }
    </style>
</head>
<body>
    <div id="main-menu" class="hidden">
        <h1>Celestial Survivor</h1>
        <button id="start-game-button">Start Game</button>
    </div>

    <div id="character-selection" class="hidden">
        <h2>Select Your Character</h2>
        <div id="character-cards"></div>
        <button id="confirm-character-button" disabled>Confirm</button>
    </div>

    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
        <div id="hud">
            <div class="bar-container">
                <div id="health-bar" style="width: 100%;"></div>
            </div>
            <div class="bar-container">
                <div id="xp-bar" style="width: 0%;"></div>
            </div>
            <div id="level-display">Lvl 1</div>
            <div id="timer-display">00:00</div>
        </div>
        <div id="level-up-screen" class="hidden">
            <h2>Level Up!</h2>
            <div id="skill-options"></div>
        </div>
    </div>

    <script>
    // --- MAIN GAME SETUP ---
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // Make canvas fill screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- GAME DATABASES (CONSTANTS) ---
        const CONFIG = {
            // Player & Physics (values are in pixels or seconds)
            PLAYER_HEALTH: 120,
            PLAYER_SPEED: 200,
            PLAYER_JUMP_FORCE: 700,
            GRAVITY: 2500,
            PLAYER_DASH_FORCE: 1000,
            PLAYER_DASH_DURATION: 0.15,
            PLAYER_DASH_COOLDOWN: 1.0,
            PLAYER_DOUBLE_JUMP_FORCE: 550,
            COYOTE_TIME: 0.1,
            JUMP_BUFFER_TIME: 0.1,

            // Gameplay
            XP_TO_NEXT_LEVEL_BASE: 80,
            XP_TO_NEXT_LEVEL_MULTIPLIER: 1.15,
            XP_ORB_ATTRACTION_RADIUS: 150,
            POWERUP_DROP_CHANCE: 0.02,
            ENEMY_KNOCKBACK_FORCE: 20, // This is now a multiplier
            ORB_HIT_COOLDOWN: 0.2,

            // World & Camera
            WORLD_BOUNDS: { width: 2400, height: 1600 },
            CAMERA_LERP_FACTOR: 0.08,

            // Misc
            SHOOTER_MIN_DISTANCE: 250,
        };

        const SKILL_DATABASE = {
            // --- Projectile Skills ---
            'divine_lance': { name: "Lança Divina", icon: "↑", type: 'projectile', autoTrigger: false, cooldown: 0.8, levels: [
                { desc: "Dispara uma lança perfurante.", count: 1, damage: 10, pierce: 2, speed: 420 },
                { desc: "Dispara duas lanças.", count: 2, damage: 12, pierce: 2, speed: 420 },
                { desc: "Aumenta o dano e a perfuração.", count: 2, damage: 15, pierce: 3, speed: 480 },
                { desc: "Dispara três lanças.", count: 3, damage: 15, pierce: 3, speed: 480 },
                { desc: "Lanças mais rápidas e fortes.", count: 3, damage: 20, pierce: 4, speed: 540 }
            ]},
            'chain_lightning': { name: "Relâmpago em Cadeia", icon: "↯", type: 'projectile', autoTrigger: true, cooldown: 2.0, causesHitStop: true, levels: [
                { desc: "Lança um raio que salta para 2 inimigos.", damage: 25, chains: 2, chainRadius: 150 },
                { desc: "O raio salta para 3 inimigos.", damage: 30, chains: 3, chainRadius: 160 },
                { desc: "Aumenta o dano e o número de saltos.", damage: 35, chains: 4, chainRadius: 170 },
                { desc: "Aumenta ainda mais o dano e os saltos.", damage: 40, chains: 5, chainRadius: 180 },
                { desc: "O raio é devastador e salta massivamente.", damage: 50, chains: 6, chainRadius: 200 }
            ]},
            // --- Orbital Skills ---
            'orbital_shield': { name: "Escudo Orbital", icon: "O", type: 'orbital', autoTrigger: false, cooldown: 0, levels: [
                { desc: "Um orbe sagrado gira ao seu redor.", count: 1, damage: 10, radius: 70, speed: 3.0 },
                { desc: "Adiciona um segundo orbe.", count: 2, damage: 8, radius: 75, speed: 3.0 },
                { desc: "Aumenta o dano dos orbes.", count: 2, damage: 15, radius: 80, speed: 3.0 },
                { desc: "Adiciona um terceiro orbe.", count: 3, damage: 15, radius: 85, speed: 3.6 },
                { desc: "Orbes mais rápidos e fortes.", count: 3, damage: 20, radius: 90, speed: 4.2 }
            ]},
            // --- Aura Skills ---
            'vortex': { name: "Vórtice Sagrado", icon: "V", type: 'aura', autoTrigger: true, cooldown: 5.0, levels: [
                { desc: "Cria um vórtice que puxa inimigos.", radius: 150, duration: 2.0, force: 90, damage: 5 },
                { desc: "Aumenta a força de atração.", radius: 160, duration: 2.0, force: 120, damage: 1 },
                { desc: "Aumenta o raio do vórtice.", radius: 200, duration: 2.5, force: 120, damage: 2 },
                { desc: "Vórtice mais duradouro e forte.", radius: 220, duration: 3.0, force: 150, damage: 2 },
            ]},
            'static_field': { name: "Campo Estático", icon: "⚡", type: 'aura', autoTrigger: true, cooldown: 5.0, levels: [
                { desc: "Cria um campo que abranda inimigos em 50%.", radius: 100, duration: 3.0, slowFactor: 0.5 }
            ]},
            'particle_burst': { name: "Explosão de Partículas", icon: "✹", type: 'aura', autoTrigger: true, cooldown: 4.0, levels: [
                { desc: "Liberta uma explosão de partículas que causa 10 de dano.", radius: 80, damage: 10, particleCount: 30 },
                { desc: "Aumenta o raio e o dano da explosão.", radius: 100, damage: 15, particleCount: 40 },
                { desc: "Aumenta ainda mais o dano e as partículas.", radius: 120, damage: 25, particleCount: 50 },
            ]},
            // --- Passive Skills ---
            'magnet': { name: "Íman Divino", icon: "M", type: 'passive', levels: [
                { desc: "Aumenta o raio de recolha de XP em 25%.", collectRadiusBonus: 0.25 },
                { desc: "Aumenta o raio de recolha de XP em 50%.", collectRadiusBonus: 0.50 },
                { desc: "Aumenta o raio de recolha de XP em 75%.", collectRadiusBonus: 0.75 },
            ]},
            'health_regen': { name: "Regeneração Divina", icon: "♥", type: 'passive', levels: [
                { desc: "Regenera 0.5 de vida por segundo.", regenPerSecond: 0.5 },
                { desc: "Regenera 1 de vida por segundo.", regenPerSecond: 1 },
                { desc: "Regenera 1.5 de vida por segundo.", regenPerSecond: 1.5 },
                { desc: "Regenera 2 de vida por segundo.", regenPerSecond: 2 },
            ]},
            'double_jump': { name: "Salto Duplo", icon: "▲", type: 'passive', levels: [{ desc: "Permite um segundo salto no ar." }] },
            // --- Utility Skills ---
            'heal': { name: "Cura Divina", icon: "+", type: 'utility', instant: true },
            'black_hole': { name: "Buraco Negro", icon: "⚫", type: 'utility', instant: true, cooldown: 15.0, levels: [{ damage: 99999 }] },
            'aegis_shield': { name: "Égide Divina", icon: "🛡️", type: 'utility', autoTrigger: true, cooldown: 10.0, levels: [{ duration: 5.0 }] },
        };

        const CHARACTER_DATABASE = {
            'SERAPH': { name: "Seraph", description: "Um anjo guerreiro equilibrado, mestre da lança.", baseHealth: 120, speed: 200, initialSkill: 'divine_lance' },
            'CHERUB': { name: "Cherub", description: "Rápido e ágil, mas mais frágil. Protegido por orbes sagrados.", baseHealth: 108, speed: 250, initialSkill: 'orbital_shield' },
            'ARCANGEL': { name: "Arcanjo", description: "Um ser poderoso que sacrifica velocidade por poder destrutivo em área.", baseHealth: 144, speed: 170, initialSkill: 'vortex' }
        };

        const WAVE_CONFIGS = [
            { duration: 30, enemies: [{ type: 'chaser', count: 5, spawnInterval: 1.0 }], eliteChance: 0 },
            { duration: 45, enemies: [{ type: 'chaser', count: 8, spawnInterval: 0.83 }, { type: 'speeder', count: 4, spawnInterval: 1.16 }], eliteChance: 0.01 },
            { duration: 60, enemies: [{ type: 'chaser', count: 10, spawnInterval: 0.75 }, { type: 'speeder', count: 6, spawnInterval: 1.0 }, { type: 'tank', count: 3, spawnInterval: 1.66 }, { type: 'charger', count: 2, spawnInterval: 3.0 }], eliteChance: 0.02 },
            { duration: 75, enemies: [{ type: 'chaser', count: 12, spawnInterval: 0.66 }, { type: 'speeder', count: 8, spawnInterval: 0.83 }, { type: 'tank', count: 4, spawnInterval: 1.5 }, { type: 'shooter', count: 2, spawnInterval: 2.0 }], eliteChance: 0.03 },
            { duration: 90, enemies: [{ type: 'chaser', count: 15, spawnInterval: 0.58 }, { type: 'speeder', count: 10, spawnInterval: 0.75 }, { type: 'tank', count: 5, spawnInterval: 1.33 }, { type: 'shooter', count: 3, spawnInterval: 1.66 }, { type: 'bomber', count: 2, spawnInterval: 2.5 }], eliteChance: 0.04 },
            { duration: 100, enemies: [{ type: 'chaser', count: 15, spawnInterval: 0.5 }, { type: 'healer', count: 1, spawnInterval: 3.33 }, { type: 'tank', count: 5, spawnInterval: 1.5 }], eliteChance: 0.05 },
            { duration: 110, enemies: [{ type: 'speeder', count: 15, spawnInterval: 0.5 }, { type: 'summoner', count: 1, spawnInterval: 4.16 }, { type: 'shooter', count: 4, spawnInterval: 1.66 }], eliteChance: 0.06 },
        ];

        const ENEMY_DATABASE = {
            'chaser': { spriteKey: 'enemyChaser', radius: 12, health: 25, speed: 140, damage: 8, xpValue: 20 },
            'speeder': { spriteKey: 'enemySpeeder', radius: 8, health: 15, speed: 220, damage: 7, xpValue: 12 },
            'tank': { spriteKey: 'enemyTank', radius: 18, health: 70, speed: 80, damage: 12, xpValue: 40 },
            'shooter': { spriteKey: 'enemyShooter', radius: 15, health: 35, speed: 50, damage: 4, xpValue: 35, attackCooldown: 2.5, projectileSpeed: 220, projectileDamage: 8 },
            'bomber': { spriteKey: 'enemyBomber', radius: 12, health: 45, speed: 90, damage: 9, xpValue: 25, explodesOnDeath: true },
            'charger': { spriteKey: 'enemyCharger', radius: 14, health: 50, speed: 120, damage: 25, xpValue: 30, attackCooldown: 4.0, chargeSpeedMult: 3, chargeDuration: 0.5, telegraphDuration: 1.0 },
            'healer': { spriteKey: 'enemyHealer', radius: 14, health: 60, speed: 45, damage: 0, xpValue: 50, healCooldown: 3.0, healAmount: 5, healRadius: 100 },
            'summoner': { spriteKey: 'enemySummoner', radius: 20, health: 80, speed: 35, damage: 0, xpValue: 70, summonCooldown: 4.0, summonType: 'chaser' },
            'reaper': { spriteKey: 'enemyReaper', radius: 10, health: 15, speed: 240, damage: 30, xpValue: 15, explodesOnDeath: true, explosionRadius: 70 },
        };

        const PERMANENT_UPGRADES_DB = {
            'max_health': { name: "Vitalidade", levels: [{ cost: 10, effect: 10 }, { cost: 25, effect: 20 }] },
            'damage_boost': { name: "Poder", levels: [{ cost: 20, effect: 0.05 }, { cost: 50, effect: 0.10 }] },
        };

        const Game = {
            // State
            time: 0,
            score: 0,
            state: 'menu', // menu, characterSelect, playing, gameOver
            playerData: {}, // For permanent upgrades, etc.
            selectedCharacter: null,

            // Core Objects
            player: null,
            camera: null,
            ui: null,
            input: { keys: {} },
            platforms: [],
            pools: {},

            // Entity Arrays
            entities: {
                enemies: [],
                projectiles: [],
                xpOrbs: [],
                particles: [],
                auras: [], // For things like Vortex, StaticField
            },

            // Wave State
            waveNumber: 0,
            waveEnemiesRemaining: 0,
            waveCooldownTimer: 3.0, // Start with a cooldown
            currentWaveConfig: {},

            // Entity Arrays
            entities: {
                enemies: [],
                projectiles: [],
                xpOrbs: [],
                particles: [],
            },

            // Asset manager
            assets: {
                images: {},
                sounds: {},
                loaded: {
                    images: {},
                    sounds: {}
                },

                async preload() {
                    const imagePaths = {
                        playerRight: 'assets/mago_direita.png',
                        playerLeft: 'assets/mago_esquerda.png',
                        enemyChaser: 'assets/chaser_esquerda.png',
                        enemySpeeder: 'assets/speeder_direita.png',
                        enemyShooter: 'assets/shooter.png',
                        enemySummoner: 'assets/summoner.png',
                        enemyBomber: 'assets/bomber.png',
                        enemyCharger: 'assets/charger.png',
                        enemyHealer: 'assets/healer.png',
                        enemyTank: 'assets/bomber.png',
                        enemyReaper: 'assets/summoner.png',
                        chainLightning: 'assets/skillrelampago_em_cadeia_vertical.gif',
                        ground: 'assets/Chãoblocoretangulo.png'
                    };

                    const promises = Object.entries(imagePaths).map(([key, path]) => {
                        return new Promise((resolve, reject) => {
                            const img = new Image();
                            img.onload = () => {
                                this.loaded.images[key] = img;
                                resolve();
                            };
                            img.onerror = () => reject(new Error(`Failed to load image: ${path}`));
                            img.src = path;
                        });
                    });

                    await Promise.all(promises);
                }
            },

            // Game Logic
            showMenu() {
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('start-game-button').onclick = () => {
                    this.setState('characterSelect');
                    this.showCharacterSelection();
                };
            },

            showCharacterSelection() {
                document.getElementById('main-menu').classList.add('hidden');
                const charScreen = document.getElementById('character-selection');
                charScreen.classList.remove('hidden');

                const cardsContainer = document.getElementById('character-cards');
                cardsContainer.innerHTML = ''; // Clear previous cards

                for (const charId in CHARACTER_DATABASE) {
                    const charData = CHARACTER_DATABASE[charId];
                    const card = document.createElement('div');
                    card.className = 'character-card';
                    card.dataset.charId = charId;
                    card.innerHTML = `<h3>${charData.name}</h3><p>${charData.description}</p>`;

                    card.onclick = () => {
                        // Handle selection
                        this.selectedCharacter = charId;
                        document.querySelectorAll('.character-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        document.getElementById('confirm-character-button').disabled = false;
                    };
                    cardsContainer.appendChild(card);
                }

                document.getElementById('confirm-character-button').onclick = () => {
                    if (this.selectedCharacter) {
                        document.getElementById('character-selection').classList.add('hidden');
                        this.init(this.selectedCharacter);
                    }
                };
            },

            init(characterId) {
                this.setState('playing');
                this.canvas = canvas; // Store canvas reference
                this.ui = new UI(this);
                this.setupInputHandlers();

                // Create platforms
                const groundLevel = CONFIG.WORLD_BOUNDS.height - 100;
                this.platforms.push(new Platform(this, 0, groundLevel, CONFIG.WORLD_BOUNDS.width, 100, true));
                this.platforms.push(new Platform(this, 300, groundLevel - 150, 200, 20));
                this.platforms.push(new Platform(this, 600, groundLevel - 250, 200, 20));

                // Create player at a starting position
                this.player = new Player(this, characterId);
                this.player.addSkill(this.player.initialSkill); // Grant initial skill
                this.player.x = CONFIG.WORLD_BOUNDS.width / 2;
                this.player.y = groundLevel - 50;

                // Create camera
                this.camera = new Camera(this, this.player);

                // Initialize pools
                this.pools.projectiles = new ObjectPool(Projectile, 50, this);
                this.pools.xpOrbs = new ObjectPool(XPOrb, 100, this);
                this.pools.vortexes = new ObjectPool(Vortex, 10, this);
                this.pools.staticFields = new ObjectPool(StaticField, 10, this);
                this.pools.enemyProjectiles = new ObjectPool(Projectile, 50, this);

                // Start the first wave
                this.startNextWave();
            },

            setupInputHandlers() {
                window.addEventListener('keydown', (e) => { this.input.keys[e.key.toLowerCase()] = true; });
                window.addEventListener('keyup', (e) => { this.input.keys[e.key.toLowerCase()] = false; });

                this.input.isMouseDown = false;
                this.input.mousePos = {x: 0, y: 0};
                canvas.addEventListener('mousedown', () => { this.input.isMouseDown = true; });
                canvas.addEventListener('mouseup', () => { this.input.isMouseDown = false; });
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.input.mousePos.x = e.clientX - rect.left;
                    this.input.mousePos.y = e.clientY - rect.top;
                });
            },

            update(dt) {
                if (this.state !== 'playing' || !this.player) return;

                // Update entities
                this.player.update(dt);
                this.camera.update(dt);

                for (let i = this.entities.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.entities.enemies[i];
                    enemy.update(dt);
                    if (enemy.isDead) {
                        this.entities.enemies.splice(i, 1);
                    }
                }

                // Wave spawning
                this.spawnEnemies(dt);

                // Collision checks
                this.handleCollisions();

                // Update pools
                if (this.pools.projectiles) this.pools.projectiles.update(dt);
                if (this.pools.xpOrbs) this.pools.xpOrbs.update(dt);
                if (this.pools.vortexes) this.pools.vortexes.update(dt);
                if (this.pools.staticFields) this.pools.staticFields.update(dt);
                if (this.pools.enemyProjectiles) this.pools.enemyProjectiles.update(dt);
            },

            handleCollisions() {
                if (!this.player) return;

                // Player vs Enemies
                for (const enemy of this.entities.enemies) {
                    if (Math.hypot(this.player.x - enemy.x, this.player.y - enemy.y) < this.player.radius + enemy.radius) {
                        if (this.player.invincibilityTimer <= 0) {
                           this.player.takeDamage(enemy.damage, enemy);
                        }
                    }
                }
            },

            render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if(this.state !== 'playing') {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                ctx.fillStyle = '#0b1220'; // Dark blue background
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (!this.camera) return;

                // Draw world elements
                this.platforms.forEach(p => p.draw(ctx));
                this.entities.enemies.forEach(e => e.draw(ctx));
                if (this.player) {
                    this.player.draw(ctx);
                    this.player.drawOverlays(ctx);
                }

                // Draw pools
                if (this.pools.projectiles) this.pools.projectiles.draw(ctx);
                if (this.pools.xpOrbs) this.pools.xpOrbs.draw(ctx);
                if (this.pools.vortexes) this.pools.vortexes.draw(ctx);
                if (this.pools.staticFields) this.pools.staticFields.draw(ctx);
                if (this.pools.enemyProjectiles) this.pools.enemyProjectiles.draw(ctx);

                // Update UI
                this.ui.update();
            },

            // Game Loop
            lastTime: 0,
            gameLoop(timestamp) {
                if(!this.lastTime) this.lastTime = timestamp;
                const dt = Math.min(0.1, (timestamp - this.lastTime) / 1000); // Prevent spiral of death
                this.lastTime = timestamp;

                this.update(dt);
                this.render();

                requestAnimationFrame(this.gameLoop.bind(this));
            },

            setState(newState) {
                this.state = newState;
                console.log("Game state changed to: ", newState);
            },

            startNextWave() {
                this.waveNumber++;
                // TODO: Handle infinite waves
                const waveIndex = Math.min(this.waveNumber - 1, WAVE_CONFIGS.length - 1);
                this.currentWaveConfig = JSON.parse(JSON.stringify(WAVE_CONFIGS[waveIndex]));

                this.waveEnemiesRemaining = 0;
                if (this.currentWaveConfig.enemies) {
                    this.currentWaveConfig.enemies.forEach(enemyType => {
                        enemyType.spawnTimer = Math.random() * enemyType.spawnInterval; // Stagger initial spawn
                        this.waveEnemiesRemaining += enemyType.count;
                    });
                }

                console.log(`DEBUG: Starting Wave ${this.waveNumber}. Enemies: ${this.waveEnemiesRemaining}`);
                console.log(`DEBUG: Wave config:`, JSON.stringify(this.currentWaveConfig));
            },

            spawnEnemies(dt) {
                // Check for end of wave
                if (this.waveEnemiesRemaining <= 0 && this.entities.enemies.length === 0) {
                    if (this.waveCooldownTimer > 0) {
                        this.waveCooldownTimer -= dt;
                    } else {
                        this.waveCooldownTimer = 3.0; // Reset cooldown
                        this.startNextWave();
                    }
                    return;
                }

                if (!this.currentWaveConfig.enemies) return;

                this.currentWaveConfig.enemies.forEach(enemyConfig => {
                    if (enemyConfig.count > 0) {
                        enemyConfig.spawnTimer -= dt;
                        if (enemyConfig.spawnTimer <= 0) {
                            enemyConfig.spawnTimer += enemyConfig.spawnInterval;

                            // Spawn logic (outside screen)
                            const spawnMargin = 50;
                            const cam = this.camera;
                            let x, y;

                            if (Math.random() < 0.5) { // Spawn left or right
                                x = (Math.random() < 0.5) ? cam.x - spawnMargin : cam.x + this.canvas.width + spawnMargin;
                                y = cam.y + Math.random() * this.canvas.height;
                            } else { // Spawn top or bottom
                                x = cam.x + Math.random() * this.canvas.width;
                                y = (Math.random() < 0.5) ? cam.y - spawnMargin : cam.y + this.canvas.height + spawnMargin;
                            }

                            const newEnemy = new Enemy(this, x, y, enemyConfig.type);
                            this.entities.enemies.push(newEnemy);
                            console.log(`DEBUG: Spawning enemy ${enemyConfig.type} at (${x.toFixed(2)}, ${y.toFixed(2)}). Remaining for type: ${enemyConfig.count - 1}`);
                            enemyConfig.count--;
                        }
                    }
                });
            }
        };

        // --- GAME CLASSES ---
        class Entity {
            constructor(game, x = 0, y = 0, radius = 0) {
                this.game = game;
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.isDead = false;
                this.active = true; // For object pooling
            }

            reset() {
                this.isDead = false;
                this.active = false;
            }

            update(dt) {
                // To be implemented by subclasses
            }

            draw(ctx) {
                // To be implemented by subclasses
            }
        }

        class Player extends Entity {
            constructor(game, characterId = 'SERAPH') {
                super(game, 0, 0, 22); // Radius ~22px

                this.shielded = false;
                this.shieldTimer = 0;

                // Sprites
                this.spriteRight = this.game.assets.loaded.images.playerRight;
                this.spriteLeft = this.game.assets.loaded.images.playerLeft;

                const characterData = CHARACTER_DATABASE[characterId];
                this.initialSkill = characterData.initialSkill;

                // Apply permanent upgrades (assuming they are loaded into game.playerData)
                const upgrades = this.game.playerData?.upgrades || {};
                const healthUpgradeLevel = upgrades.max_health || 0;
                const damageUpgradeLevel = upgrades.damage_boost || 0;

                this.baseHealth = characterData.baseHealth + (healthUpgradeLevel > 0 ? PERMANENT_UPGRADES_DB.max_health.levels[healthUpgradeLevel - 1].effect : 0);
                this.damageModifier = 1 + (damageUpgradeLevel > 0 ? PERMANENT_UPGRADES_DB.damage_boost.levels[damageUpgradeLevel - 1].effect : 0);

                // Core Stats
                this.maxHealth = this.baseHealth;
                this.health = this.maxHealth;
                this.speed = characterData.speed;
                this.xp = 0;
                this.level = 1;
                this.xpToNextLevel = CONFIG.XP_TO_NEXT_LEVEL_BASE;
                this.skills = {};
                this.collectRadius = CONFIG.XP_ORB_ATTRACTION_RADIUS;

                // State & Movement
                this.facingRight = true;
                this.velocityY = 0;
                this.onGround = false;
                this.jumpsAvailable = 1;
                this.isDashing = false;
                this.lastMoveDirection = { x: 1, y: 0 };
                this.knockbackVelocity = { x: 0, y: 0 };

                // Timers (in seconds)
                this.hitTimer = 0;
                this.dashTimer = 0;
                this.dashCooldown = 0;
                this.invincibilityTimer = 0;
                this.coyoteTimer = 0;
                this.jumpBufferTimer = 0;

                // Animation
                this.animationFrame = 0;

                // Set initial position
                const groundPlatform = this.game.platforms?.find(p => p.isGround);
                this.x = 0;
                this.y = groundPlatform ? groundPlatform.y - this.radius : this.game.canvas.height - 100 - this.radius;
                this.onGround = true;
            }

            update(dt) {
                this.animationFrame++;

                // Decrement timers
                if (this.invincibilityTimer > 0) this.invincibilityTimer -= dt;
                if (this.shieldTimer > 0) { this.shieldTimer -= dt; if (this.shieldTimer <= 0) this.shielded = false; }
                if (this.coyoteTimer > 0) this.coyoteTimer -= dt;
                if (this.jumpBufferTimer > 0) this.jumpBufferTimer -= dt;
                if (this.hitTimer > 0) this.hitTimer -= dt;
                if (this.dashCooldown > 0) this.dashCooldown -= dt;

                this.handleMovement(dt);
                this.applyGravity(dt);
                this.updateSkills(dt);

                // Regen
                if (this.skills.health_regen) {
                    const regenLevelData = SKILL_DATABASE.health_regen.levels[this.skills.health_regen.level - 1];
                    this.health = Math.min(this.maxHealth, this.health + regenLevelData.regenPerSecond * dt);
                }

                // World bounds
                const halfWorldWidth = CONFIG.WORLD_BOUNDS.width / 2;
                this.x = Math.max(-halfWorldWidth + this.radius, Math.min(this.x, halfWorldWidth - this.radius));
            }

            handleMovement(dt) {
                // Apply knockback
                this.x += this.knockbackVelocity.x * dt;
                this.y += this.knockbackVelocity.y * dt;
                this.knockbackVelocity.x *= 0.95; // Friction
                this.knockbackVelocity.y *= 0.95;

                // Dash logic
                if (this.isDashing) {
                    if (this.dashTimer > 0) {
                        this.dashTimer -= dt;
                        this.x += this.dashDirection.x * CONFIG.PLAYER_DASH_FORCE * dt;
                        this.y += this.dashDirection.y * CONFIG.PLAYER_DASH_FORCE * dt;
                    } else {
                        this.isDashing = false;
                    }
                    return; // No other movement while dashing
                }

                // Player input
                const input = this.game.input;
                let dx = (input.keys.d || input.keys.arrowright) ? 1 : ((input.keys.a || input.keys.arrowleft) ? -1 : 0);

                if (dx !== 0) {
                    this.lastMoveDirection = { x: dx, y: 0 };
                    this.facingRight = dx > 0;
                }

                this.x += dx * this.speed * dt;

                // Jump logic
                const jumpPressed = (input.keys.w || input.keys.arrowup || input.keys[' ']);
                if (jumpPressed) {
                    this.jumpBufferTimer = CONFIG.JUMP_BUFFER_TIME;
                }

                if (this.jumpBufferTimer > 0) {
                     if (this.onGround || this.coyoteTimer > 0) {
                        this.velocityY = -CONFIG.PLAYER_JUMP_FORCE;
                        this.onGround = false;
                        this.coyoteTimer = 0;
                        this.jumpBufferTimer = 0;
                        this.jumpsAvailable = (this.skills.double_jump ? 2 : 1) - 1;
                    } else if (this.jumpsAvailable > 0 && this.skills.double_jump) {
                        this.velocityY = -CONFIG.PLAYER_DOUBLE_JUMP_FORCE;
                        this.jumpsAvailable--;
                        this.jumpBufferTimer = 0;
                    }
                }

                // Dash activation
                if (input.keys.shift) {
                    this.dash();
                    input.keys.shift = false; // Consume dash input
                }
            }

            applyGravity(dt) {
                if (!this.game.platforms) return;
                const wasOnGround = this.onGround;
                this.velocityY += CONFIG.GRAVITY * dt;

                const oldY = this.y;
                let newY = this.y + this.velocityY * dt;

                this.onGround = false;

                for (const p of this.game.platforms) {
                    if (this.x + this.radius > p.x && this.x - this.radius < p.x + p.width &&
                        oldY + this.radius <= p.y && newY + this.radius >= p.y) {

                        newY = p.y - this.radius;
                        this.velocityY = 0;
                        this.onGround = true;

                        if (!wasOnGround) {
                            this.jumpsAvailable = (this.skills.double_jump ? 2 : 1);
                        }
                        break;
                    }
                }

                this.y = newY;

                if (wasOnGround && !this.onGround) {
                    this.coyoteTimer = CONFIG.COYOTE_TIME;
                }
            }

            dash() {
                if (this.dashCooldown > 0 || this.isDashing) return;

                this.isDashing = true;
                this.dashTimer = CONFIG.PLAYER_DASH_DURATION;
                this.dashCooldown = CONFIG.PLAYER_DASH_COOLDOWN;
                this.invincibilityTimer = Math.max(this.invincibilityTimer, CONFIG.PLAYER_DASH_DURATION);

                this.dashDirection = { x: this.lastMoveDirection.x, y: 0 }; // Horizontal dash only
                if (this.dashDirection.x === 0) {
                    this.dashDirection.x = this.facingRight ? 1 : -1;
                }
            }

            takeDamage(amount, source = null) {
                if (this.invincibilityTimer > 0 || this.isDashing) return;
                if (this.shielded) {
                    this.shielded = false;
                    this.shieldTimer = 0;
                    // TODO: Add shield break particle effect
                    return;
                }

                this.health -= amount;
                this.hitTimer = 0.5; // 0.5s red flash
                this.invincibilityTimer = 0.6; // 0.6s of I-frames

                if (source) {
                    const knockbackForce = 250;
                    const angle = Math.atan2(this.y - source.y, this.x - source.x);
                    this.knockbackVelocity.x = Math.cos(angle) * knockbackForce;
                    this.velocityY = -200; // Upward bump
                }

                if (this.health <= 0) {
                    this.health = 0;
                    this.isDead = true;
                    this.game.setState('gameOver');
                }
            }

            addXp(amount) {
                this.xp += amount;
                while (this.xp >= this.xpToNextLevel) {
                    this.level++;
                    this.xp -= this.xpToNextLevel;
                    this.xpToNextLevel = Math.floor(this.xpToNextLevel * CONFIG.XP_TO_NEXT_LEVEL_MULTIPLIER);
                    this.game.setState('levelUp');
                }
            }

            addSkill(skillId) {
                const skillData = SKILL_DATABASE[skillId];
                if (this.skills[skillId]) {
                    this.skills[skillId].level++;
                } else {
                    this.skills[skillId] = { level: 1, timer: 0 };
                    if (skillData.type === 'orbital') {
                        this.skills[skillId].orbs = []; // Initialize for orbital skills
                    }
                }
                this.game.ui.updateSkillsHUD(); // Update the UI when a skill is added/leveled
            },

            updateSkills(dt) {
                for (const skillId in this.skills) {
                    const skillState = this.skills[skillId];
                    const skillData = SKILL_DATABASE[skillId];

                    if (skillState.timer > 0) {
                        skillState.timer -= dt;
                    }

                    // Handle skill triggers
                    if (skillState.timer <= 0) {
                        if (skillData.autoTrigger) {
                            this.triggerSkill(skillId, skillState, skillData);
                        } else if (skillId === this.initialSkill && this.game.input.isMouseDown) {
                            this.triggerSkill(skillId, skillState, skillData);
                        }
                    }

                    // Handle continuous logic for certain skill types
                    if (skillData.type === 'orbital') {
                        this.updateOrbitalSkill(dt, skillId, skillState, skillData);
                    }
                }
            },

            triggerSkill(skillId, skillState, skillData) {
                const levelData = skillData.levels[skillState.level - 1];
                const damage = (levelData.damage || 0) * this.damageModifier;
                skillState.timer = skillData.cooldown; // Reset cooldown

                switch(skillData.type) {
                    case 'projectile': {
                        let angle;
                        if (this.game.input.isMouseDown && skillId === this.initialSkill) {
                            const worldMouse = this.game.camera.screenToWorld(this.game.input.mousePos);
                            angle = Math.atan2(worldMouse.y - this.y, worldMouse.x - this.x);
                        } else {
                            const target = this.findNearestEnemy();
                            if (!target) return; // No target, no projectile
                            angle = Math.atan2(target.y - this.y, target.x - this.x);
                        }

                        for (let i = 0; i < levelData.count; i++) {
                            const spreadAngle = (i - (levelData.count - 1) / 2) * 0.15;
                            this.game.pools.projectiles.spawn(
                                this.x, this.y, angle + spreadAngle,
                                { ...levelData, damage }, skillId
                            );
                        }
                        break;
                    }
                    case 'aura': {
                        if (skillId === 'vortex') {
                            this.game.pools.vortexes.spawn(this.x, this.y, levelData);
                        } else if (skillId === 'static_field') {
                            this.game.pools.staticFields.spawn(this.x, this.y, levelData);
                        }
                        break;
                    }
                    case 'utility': {
                        if (skillId === 'aegis_shield') {
                            this.shielded = true;
                            this.shieldTimer = levelData.duration;
                        }
                        break;
                    }
                }
            },

            updateOrbitalSkill(dt, skillId, skillState, skillData) {
                const levelData = skillData.levels[skillState.level - 1];

                // Initialize orbs if count has changed
                if (skillState.orbs.length !== levelData.count) {
                    skillState.orbs = Array.from({ length: levelData.count }, (_, i) => ({
                        angle: (i / levelData.count) * 2 * Math.PI,
                        hitCooldowns: new Map()
                    }));
                }

                // Update each orb
                for (const orb of skillState.orbs) {
                    orb.angle += levelData.speed * dt;
                    const orbX = this.x + Math.cos(orb.angle) * levelData.radius;
                    const orbY = this.y + Math.sin(orb.angle) * levelData.radius;
                    const orbRadius = 10;

                    // Check for collisions with enemies
                    for (const enemy of this.game.entities.enemies) {
                        const lastHit = orb.hitCooldowns.get(enemy) || 0;
                        if (this.game.time - lastHit < CONFIG.ORB_HIT_COOLDOWN) continue;

                        if (!enemy.isDead && Math.hypot(orbX - enemy.x, orbY - enemy.y) < orbRadius + enemy.radius) {
                            enemy.takeDamage(levelData.damage * this.damageModifier);
                            orb.hitCooldowns.set(enemy, this.game.time);
                        }
                    }
                }
            },

            findNearestEnemy() {
                let nearest = null;
                let nearestDistSq = Infinity;
                for (const enemy of this.game.entities.enemies) {
                    if (enemy.isDead) continue;
                    const distSq = (this.x - enemy.x)**2 + (this.y - enemy.y)**2;
                    if (distSq < nearestDistSq) {
                        nearestDistSq = distSq;
                        nearest = enemy;
                    }
                }
                return nearest;
            },

            drawOverlays(ctx) {
                const camera = this.game.camera;
                if (!camera) return;

                // Draw shield
                if (this.shielded) {
                    ctx.beginPath();
                    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius * 1.2, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + 0.5 * Math.sin(this.game.time * 5)})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                for (const skillId in this.skills) {
                    const skillState = this.skills[skillId];
                    const skillData = SKILL_DATABASE[skillId];

                    if (skillData.type === 'orbital' && skillState.orbs) {
                        const levelData = skillData.levels[skillState.level - 1];

                        skillState.orbs.forEach(orb => {
                            const orbX = this.x + Math.cos(orb.angle) * levelData.radius;
                            const orbY = this.y + Math.sin(orb.angle) * levelData.radius;

                            ctx.fillStyle = 'lightblue';
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.arc(orbX - camera.x, orbY - camera.y, 10, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        });
                    }
                }
            }

            draw(ctx) {
                if (this.invincibilityTimer > 0 && this.animationFrame % 8 < 4) {
                    return; // Flicker effect
                }

                const camera = this.game.camera;
                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);

                const currentSprite = this.facingRight ? this.spriteRight : this.spriteLeft;
                if (!currentSprite) { // Asset not loaded fallback
                    ctx.fillStyle = 'white';
                    ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
                    ctx.restore();
                    return;
                }

                const drawHeight = this.radius * 2.5;
                const aspectRatio = currentSprite.naturalWidth / currentSprite.naturalHeight;
                const drawWidth = drawHeight * aspectRatio;

                if (this.hitTimer > 0) {
                    // Red flash effect
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.fillRect(-drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    ctx.globalCompositeOperation = 'source-over';
                }

                ctx.drawImage(currentSprite, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                ctx.restore();
            }
        }

        class Platform extends Entity {
            constructor(game, x, y, width, height, isGround = false) {
                super(game, x, y);
                this.width = width;
                this.height = height;
                this.isGround = isGround;
                this.pattern = null; // Lazy-initialized on first draw
            }

            draw(ctx) {
                if (!this.pattern) {
                    const groundImg = this.game.assets.loaded.images.ground;
                    if (groundImg) {
                        this.pattern = ctx.createPattern(groundImg, 'repeat');
                    } else {
                        this.pattern = 'saddlebrown'; // Fallback color if asset fails
                    }
                }

                const camera = this.game.camera;
                if (!camera) return;

                // Basic culling
                if (this.x + this.width < camera.x || this.x > camera.x + this.game.canvas.width) {
                    return;
                }

                ctx.fillStyle = this.pattern;
                ctx.fillRect(this.x - camera.x, this.y - camera.y, this.width, this.height);
            }
        }

        class Camera {
            constructor(game, target) {
                this.game = game;
                this.target = target; // The entity to follow
                this.x = 0; // Top-left corner of the camera in world coordinates
                this.y = 0;
            }

            update(dt) {
                if (!this.target) return;

                // Target position for the camera's top-left corner
                const targetX = this.target.x - this.game.canvas.width / 2;
                const targetY = this.target.y - this.game.canvas.height / 2;

                // Smoothly interpolate towards the target
                this.x += (targetX - this.x) * CONFIG.CAMERA_LERP_FACTOR;
                this.y += (targetY - this.y) * CONFIG.CAMERA_LERP_FACTOR;

                // Clamp camera to world bounds to prevent seeing outside the world
                const worldWidth = CONFIG.WORLD_BOUNDS.width;
                const worldHeight = CONFIG.WORLD_BOUNDS.height;
                const canvasWidth = this.game.canvas.width;
                const canvasHeight = this.game.canvas.height;

                this.x = Math.max(0, Math.min(this.x, worldWidth - canvasWidth));
                this.y = Math.max(0, Math.min(this.y, worldHeight - canvasHeight));
            }

            screenToWorld(pos) {
                return { x: pos.x + this.x, y: pos.y + this.y };
            }
        }

        class ObjectPool {
            constructor(ClassRef, initialSize, game) {
                this.ClassRef = ClassRef;
                this.game = game;
                this.pool = [];
                this.activeObjects = [];

                for (let i = 0; i < initialSize; i++) {
                    const obj = new this.ClassRef(this.game);
                    obj.active = false;
                    this.pool.push(obj);
                }
            }

            spawn(...args) {
                let obj = this.pool.pop();
                if (!obj) {
                    // Pool is empty, create a new object as a fallback
                    obj = new this.ClassRef(this.game);
                }

                obj.active = true;
                if (obj.init) {
                    obj.init(...args);
                }
                this.activeObjects.push(obj);
                return obj;
            }

            release(obj) {
                obj.active = false;
                if (obj.reset) {
                    obj.reset();
                }
                this.pool.push(obj);
            }

            update(dt) {
                for (let i = this.activeObjects.length - 1; i >= 0; i--) {
                    const obj = this.activeObjects[i];
                    obj.update(dt);
                    if (obj.isDead) {
                        this.release(obj);
                        this.activeObjects.splice(i, 1);
                    }
                }
            }

            draw(ctx) {
                this.activeObjects.forEach(obj => obj.draw(ctx));
            }
        }

        class XPOrb extends Entity {
            constructor(game) {
                super(game);
                this.value = 0;
                this.attractionSpeed = 400; // pixels per second
            }

            init(x, y, value) {
                this.x = x;
                this.y = y;
                this.value = value;
                this.isDead = false;
            }

            update(dt) {
                const player = this.game.player;
                if (!player) return;

                const dist = Math.hypot(player.x - this.x, player.y - this.y);

                // Attract to player when within their collection radius
                if (dist < player.collectRadius) {
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(angle) * this.attractionSpeed * dt;
                    this.y += Math.sin(angle) * this.attractionSpeed * dt;
                }

                // Check for actual collection
                if (dist < player.radius) {
                    player.addXp(this.value);
                    this.isDead = true;
                }
            }

            draw(ctx) {
                const camera = this.game.camera;
                if (!camera) return;

                ctx.fillStyle = 'cyan';
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class UI {
            constructor(game) {
                this.game = game;
                this.hud = document.getElementById('hud');
                this.healthBar = document.getElementById('health-bar');
                this.xpBar = document.getElementById('xp-bar');
                this.levelDisplay = document.getElementById('level-display');
                this.timerDisplay = document.getElementById('timer-display');
                this.levelUpScreen = document.getElementById('level-up-screen');
                this.skillOptions = document.getElementById('skill-options');
            }

            update() {
                // Update HUD based on game state
                if (this.game.state === 'playing') {
                    this.hud.classList.remove('hidden');
                    this.updateHUD();
                } else {
                    this.hud.classList.add('hidden');
                }

                // Handle Level-Up screen
                if (this.game.state === 'levelUp') {
                    if (this.levelUpScreen.classList.contains('hidden')) {
                        this.populateLevelUpOptions();
                        this.levelUpScreen.classList.remove('hidden');
                    }
                } else {
                    this.levelUpScreen.classList.add('hidden');
                }
            }

            updateHUD() {
                const player = this.game.player;
                if (!player) return;

                this.healthBar.style.width = `${(player.health / player.maxHealth) * 100}%`;
                this.xpBar.style.width = `${(player.xp / player.xpToNextLevel) * 100}%`;
                this.levelDisplay.textContent = `Lvl ${player.level}`;

                const minutes = Math.floor(this.game.time / 60);
                const seconds = Math.floor(this.game.time % 60);
                this.timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            populateLevelUpOptions() {
                this.skillOptions.innerHTML = ''; // Clear old options
                const player = this.game.player;
                const potentialOptions = [];
                const presentedOptions = [];

                // 1. Check for initial skill upgrade
                const initialSkillId = player.initialSkill;
                const initialSkillState = player.skills[initialSkillId];
                if (initialSkillState) {
                    const initialSkillData = SKILL_DATABASE[initialSkillId];
                    if (initialSkillState.level < initialSkillData.levels.length) {
                        // Add as a guaranteed option
                        presentedOptions.push({ type: 'upgrade', id: initialSkillId });
                    }
                }

                // 2. Find other available upgrades
                for (const skillId in player.skills) {
                    if (skillId === initialSkillId) continue; // Already handled
                    const skillState = player.skills[skillId];
                    const skillData = SKILL_DATABASE[skillId];
                    if (skillState.level < skillData.levels.length) {
                        potentialOptions.push({ type: 'upgrade', id: skillId });
                    }
                }

                // 3. Find available new skills
                const ownedSkillIds = Object.keys(player.skills);
                const allSkillIds = Object.keys(SKILL_DATABASE);
                const newSkillIds = allSkillIds.filter(id => {
                    const skillData = SKILL_DATABASE[id];
                    const isLeveledUtility = skillData.type === 'utility' && skillData.levels;
                    const isPassiveOrAuraOrProjectile = ['passive', 'aura', 'projectile', 'orbital'].includes(skillData.type);
                    return !ownedSkillIds.includes(id) && (isPassiveOrAuraOrProjectile || isLeveledUtility);
                });

                newSkillIds.forEach(id => potentialOptions.push({ type: 'new', id: id }));

                // 4. Fill remaining slots with random options
                const shuffle = (array) => {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                };
                shuffle(potentialOptions);

                while (presentedOptions.length < 3 && potentialOptions.length > 0) {
                    presentedOptions.push(potentialOptions.pop());
                }

                // 5. If no options, offer a heal as a fallback
                if (presentedOptions.length === 0) {
                     presentedOptions.push({ type: 'utility', id: 'heal' });
                }

                // 6. Create the UI cards for the options
                presentedOptions.forEach(option => {
                    const skillId = option.id;
                    const skill = SKILL_DATABASE[skillId];
                    const card = document.createElement('div');
                    card.className = 'skill-card';

                    let currentLevel = player.skills[skillId]?.level || 0;

                    if (option.type === 'upgrade') {
                        const nextLevelData = skill.levels[currentLevel];
                        card.innerHTML = `<h3>${skill.name} (Lvl ${currentLevel + 1})</h3><p>${nextLevelData.desc}</p>`;
                    } else if (option.type === 'new') {
                        card.innerHTML = `<h3>${skill.name} (Novo)</h3><p>${skill.levels[0].desc}</p>`;
                    } else { // Utility like 'heal'
                        card.innerHTML = `<h3>${skill.name}</h3><p>Recupera 30% da vida máxima.</p>`;
                    }

                    card.onclick = () => {
                        if (option.id === 'heal') {
                            player.health = Math.min(player.maxHealth, player.health + player.maxHealth * 0.30);
                        } else {
                            player.addSkill(skillId);
                        }
                        this.game.setState('playing');
                        // Need to clear the options to prevent double-clicking
                        this.skillOptions.innerHTML = '';
                    };
                    this.skillOptions.appendChild(card);
                });
            }
        }

        class StaticField extends Entity {
            constructor(game) {
                super(game);
            }

            init(x, y, levelData) {
                this.x = x;
                this.y = y;
                this.radius = levelData.radius;
                this.duration = levelData.duration;
                this.slowFactor = levelData.slowFactor;
                this.isDead = false;
            }

            update(dt) {
                this.duration -= dt;
                if (this.duration <= 0) {
                    this.isDead = true;
                    return;
                }

                // Apply slow effect to enemies within radius
                for (const enemy of this.game.entities.enemies) {
                    if (!enemy.isDead && Math.hypot(this.x - enemy.x, this.y - enemy.y) < this.radius) {
                        enemy.applySlow(this.slowFactor, 0.25); // Apply slow for a short duration
                    }
                }
            }

            draw(ctx) {
                const camera = this.game.camera;
                if (!camera) return;

                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);
                const lifeRatio = this.duration / SKILL_DATABASE.static_field.levels[0].duration;
                ctx.strokeStyle = `rgba(0, 255, 255, ${lifeRatio * 0.4})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Vortex extends Entity {
            constructor(game) {
                super(game);
                this.damageTimer = 1.0; // Deals damage every second
            }

            init(x, y, levelData) {
                this.x = x;
                this.y = y;
                this.radius = levelData.radius;
                this.duration = levelData.duration;
                this.force = levelData.force;
                this.damage = levelData.damage;
                this.isDead = false;
                this.damageTimer = 1.0;
            }

            update(dt) {
                this.duration -= dt;
                if (this.duration <= 0) {
                    this.isDead = true;
                    return;
                }

                this.damageTimer -= dt;
                const dealDamageThisFrame = this.damageTimer <= 0;
                if (dealDamageThisFrame) {
                    this.damageTimer = 1.0;
                }

                for (const enemy of this.game.entities.enemies) {
                    if (enemy.isDead) continue;

                    const dist = Math.hypot(this.x - enemy.x, this.y - enemy.y);
                    if (dist < this.radius) {
                        const angle = Math.atan2(this.y - enemy.y, this.x - enemy.x);
                        enemy.x += Math.cos(angle) * this.force * dt;
                        enemy.y += Math.sin(angle) * this.force * dt;

                        if (dealDamageThisFrame && this.damage > 0) {
                            enemy.takeDamage(this.damage * this.game.player.damageModifier);
                        }
                    }
                }
            }

            draw(ctx) {
                const camera = this.game.camera;
                if (!camera) return;

                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);
                const lifeRatio = this.duration / SKILL_DATABASE.vortex.levels[0].duration;
                ctx.fillStyle = `rgba(150, 0, 255, ${0.1 + lifeRatio * 0.2})`;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Projectile extends Entity {
            constructor(game) {
                super(game);
                this.velocity = { x: 0, y: 0 };
                this.damage = 0;
                this.pierce = 1;
                this.skillId = null;
                this.piercedEnemies = new Set();
                this.isEnemy = false;
            }

            init(x, y, angle, skillData, skillId) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.velocity.x = Math.cos(angle) * skillData.speed;
                this.velocity.y = Math.sin(angle) * skillData.speed;
                this.damage = skillData.damage;
                this.pierce = skillData.pierce || 1;
                this.skillId = skillId;
                this.isDead = false;
                this.isEnemy = skillData.isEnemy || false;
                this.piercedEnemies.clear();
            }

            update(dt) {
                this.x += this.velocity.x * dt;
                this.y += this.velocity.y * dt;

                if (this.x < 0 || this.x > CONFIG.WORLD_BOUNDS.width || this.y < 0 || this.y > CONFIG.WORLD_BOUNDS.height) {
                    this.isDead = true;
                }

                if (this.isEnemy) {
                    const player = this.game.player;
                    if (player && !player.isDead && Math.hypot(this.x - player.x, this.y - player.y) < this.radius + player.radius) {
                        player.takeDamage(this.damage, this);
                        this.isDead = true;
                    }
                } else {
                    for (const enemy of this.game.entities.enemies) {
                        if (!this.piercedEnemies.has(enemy) && !enemy.isDead && Math.hypot(this.x - enemy.x, this.y - enemy.y) < this.radius + enemy.radius) {
                            enemy.takeDamage(this.damage);
                            enemy.applyKnockback(this.x, this.y, 1);
                            this.piercedEnemies.add(enemy);

                            if (this.piercedEnemies.size >= this.pierce) {
                                this.isDead = true;
                                break;
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                const camera = this.game.camera;
                if (!camera) return;

                ctx.fillStyle = this.isEnemy ? '#ff6666' : '#fff38a';
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.isEnemy ? 7 : 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Enemy extends Entity {
            constructor(game, x, y, type = 'chaser', isElite = false) {
                const data = ENEMY_DATABASE[type];
                super(game, x, y, data.radius);

                this.type = type;
                this.isElite = isElite;

                // Base stats from DB
                this.speed = data.speed;
                this.health = data.health;
                this.maxHealth = data.health;
                this.damage = data.damage;
                this.xpValue = data.xpValue;
                this.sprite = this.game.assets.loaded.images[data.spriteKey];

                // Type-specific properties from DB
                this.attackCooldown = data.attackCooldown || 0;
                this.attackTimer = this.attackCooldown * Math.random();
                this.explodesOnDeath = data.explodesOnDeath || false;
                this.explosionRadius = data.explosionRadius || 50;
                this.healAmount = data.healAmount || 0;
                this.healRadius = data.healRadius || 0;
                this.summonType = data.summonType || null;
                this.projectileDamage = data.projectileDamage || 0;
                this.projectileSpeed = data.projectileSpeed || 0;

                // State machine for charger
                this.state = 'chasing';
                this.chargeTimer = 0;
                this.chargeAngle = 0;

                // Elite modifications
                if (isElite) {
                    this.radius *= 1.5;
                    this.health *= 2.5;
                    this.maxHealth *= 2.5;
                    this.damage *= 1.5;
                    this.xpValue *= 2;
                }

                // General state
                this.facingRight = true;
                this.hitTimer = 0;
                this.knockbackVelocity = { x: 0, y: 0 };
                this.slowTimer = 0;
                this.slowFactor = 0;
            }

            update(dt) {
                if (this.hitTimer > 0) this.hitTimer -= dt;
                if (this.slowTimer > 0) this.slowTimer -= dt;

                // Apply knockback
                this.x += this.knockbackVelocity.x * dt;
                this.y += this.knockbackVelocity.y * dt;
                this.knockbackVelocity.x *= 0.95;
                this.knockbackVelocity.y *= 0.95;

                // AI Logic
                const player = this.game.player;
                if (!player || player.isDead) return;

                let moveSpeed = this.speed;
                if (this.slowTimer > 0) {
                    moveSpeed *= (1 - this.slowFactor);
                }

                const data = ENEMY_DATABASE[this.type];

                // --- CHARGER STATE MACHINE ---
                if (this.type === 'charger') {
                    switch (this.state) {
                        case 'chasing':
                            // Chase the player
                            const angle = Math.atan2(player.y - this.y, player.x - this.x);
                            this.x += Math.cos(angle) * moveSpeed * dt;
                            this.y += Math.sin(angle) * moveSpeed * dt;
                            this.facingRight = (player.x > this.x);

                            // Check if ready to attack
                            if (this.attackTimer > 0) this.attackTimer -= dt;
                            if (this.attackTimer <= 0) {
                                this.state = 'telegraphing';
                                this.chargeTimer = data.telegraphDuration;
                            }
                            break;

                        case 'telegraphing':
                            this.chargeTimer -= dt;
                            // Stand still and "telegraph" the attack
                            if (this.chargeTimer <= 0) {
                                this.state = 'charging';
                                this.chargeTimer = data.chargeDuration;
                                // Lock onto player's position
                                this.chargeAngle = Math.atan2(player.y - this.y, player.x - this.x);
                            }
                            break;

                        case 'charging':
                            this.chargeTimer -= dt;
                            const chargeSpeed = moveSpeed * data.chargeSpeedMult;
                            this.x += Math.cos(this.chargeAngle) * chargeSpeed * dt;
                            this.y += Math.sin(this.chargeAngle) * chargeSpeed * dt;

                            if (this.chargeTimer <= 0) {
                                this.state = 'chasing';
                                this.attackTimer = this.attackCooldown; // Start cooldown
                            }
                            break;
                    }
                }
                // --- OTHER ENEMY AI ---
                else {
                    let targetX = player.x;
                    let targetY = player.y;

                    // Shooter AI: maintain distance
                    if (this.type === 'shooter') {
                        const dist = Math.hypot(targetX - this.x, targetY - this.y);
                        if (dist < CONFIG.SHOOTER_MIN_DISTANCE) {
                            moveSpeed = -this.speed; // Flee
                        } else if (dist > CONFIG.SHOOTER_MIN_DISTANCE + 50) {
                            moveSpeed = this.speed; // Chase
                        } else {
                            moveSpeed = 0; // Hold position
                        }
                    }

                    // Healers and Summoners don't chase player
                    const canChase = moveSpeed !== 0 && this.type !== 'healer' && this.type !== 'summoner';
                    if (canChase) {
                        const angle = Math.atan2(targetY - this.y, targetX - this.x); // Fixed bug here
                        this.x += Math.cos(angle) * moveSpeed * dt;
                        this.y += Math.sin(angle) * moveSpeed * dt;
                        this.facingRight = (targetX > this.x);
                    }

                    // Attack Logic for non-chargers
                    if (this.attackCooldown > 0) {
                        this.attackTimer -= dt;
                        if (this.attackTimer <= 0) {
                            this.attackTimer = this.attackCooldown;
                            if (this.type === 'shooter') {
                                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                                const projData = { speed: this.projectileSpeed, damage: this.projectileDamage, isEnemy: true };
                                this.game.pools.enemyProjectiles.spawn(this.x, this.y, angle, projData, 'enemy_shot');
                            } else if (this.type === 'healer') {
                                for (const other of this.game.entities.enemies) {
                                    if (other !== this && !other.isDead && Math.hypot(this.x - other.x, this.y - other.y) < this.healRadius) {
                                        other.health = Math.min(other.maxHealth, other.health + this.healAmount);
                                    }
                                }
                            } else if (this.type === 'summoner') {
                                const newEnemy = new Enemy(this.game, this.x, this.y, this.summonType);
                                this.game.entities.enemies.push(newEnemy);
                                this.game.waveEnemiesRemaining++;
                            }
                        }
                    }
                }
            }

            takeDamage(amount) {
                if (this.isDead) return;
                this.health -= amount;
                this.hitTimer = 0.1;

                if (this.health <= 0) {
                    this.isDead = true;
                    this.game.pools.xpOrbs.spawn(this.x, this.y, this.xpValue);
                    this.game.score += this.xpValue;
                    this.game.waveEnemiesRemaining--;

                    if (this.explodesOnDeath) {
                        const explosionData = {
                            radius: this.explosionRadius,
                            duration: 0.25,
                            force: 0, // No pull, just damage
                            damage: this.damage,
                        };
                        this.game.pools.vortexes.spawn(this.x, this.y, explosionData);
                    }
                }
            }

            applyKnockback(sourceX, sourceY, force) {
                const angle = Math.atan2(this.y - sourceY, this.x - sourceX);
                const knockbackStrength = 1200; // A fixed impulse value
                this.knockbackVelocity.x = Math.cos(angle) * knockbackStrength;
                this.knockbackVelocity.y = Math.sin(angle) * knockbackStrength;
            },

            applySlow(factor, duration) {
                this.slowFactor = Math.max(this.slowFactor, factor);
                this.slowTimer = Math.max(this.slowTimer, duration);
            }

            draw(ctx) {
                const camera = this.game.camera;
                if (!this.sprite || !camera) return;

                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);

                // Telegraphing visual effect
                if (this.type === 'charger' && this.state === 'telegraphing') {
                    ctx.fillStyle = `rgba(255, 165, 0, ${0.3 + 0.3 * Math.sin(this.game.time * 10)})`; // Pulsing orange
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (!this.facingRight) {
                    ctx.scale(-1, 1);
                }

                const drawHeight = this.radius * 2.5;
                const aspectRatio = this.sprite.naturalWidth / this.sprite.naturalHeight;
                const drawWidth = drawHeight * aspectRatio;

                if (this.hitTimer > 0) {
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillRect(-drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    ctx.globalCompositeOperation = 'source-over';
                }

                if (this.isElite) {
                    ctx.fillStyle = 'gold';
                    ctx.filter = 'blur(8px)';
                    ctx.drawImage(this.sprite, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    ctx.filter = 'none';
                }

                ctx.drawImage(this.sprite, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

                ctx.restore();
            }
        }

        // --- STARTUP ---
        Game.assets.preload().then(() => {
            Game.showMenu();
            requestAnimationFrame(Game.gameLoop.bind(Game));
        }).catch(err => {
            console.error("Failed to load assets:", err);
            document.body.innerHTML = "Failed to load assets. Please check the console.";
        });
    });
    </script>
</body>
